server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: backend
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=medical_system;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

app:
  jwt:
    # change in production
    secret: "${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}"
    expire-seconds: 7200
    issuer: "medical-system"
  # AI 大模型配置（DeepSeek 官方 API）
  ai:
    api-key: "${AI_API_KEY}"
    api-url: "${AI_API_URL:https://api.deepseek.com/v1/chat/completions}"
    model: "${AI_MODEL:deepseek-v4-flash}"
    # 语义缓存配置
    semantic-cache:
      enabled: true
      threshold: 0.88
      ttl-seconds: 3600
      max-entries: 1000
    # Embedding API 配置
    embedding-url: "${AI_EMBEDDING_URL:https://api.deepseek.com/v1/embeddings}"
    embedding-model: "${AI_EMBEDDING_MODEL:deepseek-chat}"
  upload:
    path: "${UPLOAD_PATH:./uploads}"
  cors:
    allowed-origins:
      - "http://localhost:5173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true
